# The one file you edit. All four scripts read it.
# Paths are relative to the folder that holds this file (or absolute).

[inputs]
rates_E = "data/rates_3Prime-5Prime-h2-3301none-enhancer-3Prime.txt"   # CCAT1 (enhancer, E) fitted rates
rates_G = "data/rates_3Prime-5Prime-h2-3301none-gene-3Prime.txt"       # MYC (gene, G) fitted rates
rate_statistic = "median"                                # row of the rates files: ml, mean, median or last
experimental_curves = "data/experimental.csv"            # from experimental.R: observable, pair, lag_frames, lag_min, mean, se
experimental_metrics = "data/experimental_metrics.csv"   # from experimental.R: metric, mean, se
trace_lengths = ""                                       # "" = every simulated trace has nframes frames (see [simulation]).
                                                         # Or the path of experimental_lengths.csv from step 0: then each
                                                         # simulated trace gets the length of one experimental trace, and
                                                         # ntraces and nframes below are ignored. A file path, not a number.

[output]
run_dir = "runs/grid"                # everything is written here

[sweep]
mode = "grid"                        # "grid" or "extensive"
reciprocal_states = "same"           # reciprocal models: "same" = both directions use the same source state and the
                                     # same fold; "all_pairs" = every pair of source states and every pair of folds

# Grid sweep: every combination of these values.
coupling_fold = [1.25, 2.0, 3.0, 10.0, 30.0, 100.0, 300.0]   # activation folds. Gene-to-gene models (E_to_G, G_to_E,
                                     # reciprocal) are run with each fold and its inverse (1/fold = inhibition);
                                     # hidden models with these folds only (a hidden unit only activates)
hidden_rate = [0.01, 0.1, 1.0, 10.0] # hidden-unit switching rates, per minute

# Extensive sweep: n_extensive random combinations per model; each parameter is log-spaced over its own [min, max].
n_extensive = 100
seed = 1                             # random seed of the sampling

[sweep.extensive]
fold_EG = [0.01, 100.0]              # fold of E regulating G (below 1 inhibits, above 1 activates)
fold_GE = [0.01, 100.0]              # fold of G regulating E
fold_HE = [1.0, 100.0]               # fold of the hidden unit regulating E: activation only, so 1 or above
fold_HG = [1.0, 100.0]               # fold of the hidden unit regulating G: activation only, so 1 or above
h12 = [0.001, 1000.0]                # hidden rate state 1 -> 2, per minute (H3: E-active state 1 -> inactive state 2)
h21 = [0.001, 1000.0]                # hidden rate state 2 -> 1          (H3: inactive state 2 -> E-active state 1)
h23 = [0.001, 1000.0]                # H3 only: inactive state 2 -> G-active state 3
h32 = [0.001, 1000.0]                # H3 only: G-active state 3 -> inactive state 2

[report]                             # what 4_plot_results.py draws (leave out a value to skip its plots)
observables = ["reporter", "binary"] # reporter = reporter count, binary = ON/OFF state
curves = ["EG", "EE", "GG"]          # EG = CCAT1 x MYC cross-correlation, EE / GG = CCAT1 / MYC autocorrelation

[simulation]
simulator = "fast"                   # "fast" or "stochasticgene"
replicates = 3                       # independent datasets per simulation
ntraces = 137                        # traces per dataset
nframes = 216                        # frames per trace
interval_min = 1.6666666666666667    # minutes between frames
rate_matching = "time_average"       # how base rates are set so that a coupled rate still averages to its fitted value:
                                     # "time_average":  averaged over all time (as in the original sweep)
                                     # "state_average": averaged over the time when the gene is in the state where that
                                     #                  rate can act; keeps ON fractions close to the uncoupled fit
warmup_timescales = 3.0              # stochasticgene only: burn-in = this / slowest rate
epsilon = 1e-7                       # added to traces before correlating, as in experimental.R
score_max_lag_min = 90.0             # NRMSE and CCC use lags within +/- this many minutes
seed = 20261106

[swarm]
simulations_per_job = 12             # simulations in one swarm line (all replicates of a simulation stay together)
threads = 12                         # threads per swarm line
memory_gb = 8
walltime = "08:00:00"
julia = "julia"
julia_project = ""                   # StochasticGene project folder; needed for simulator = "stochasticgene"
modules = "julia"
